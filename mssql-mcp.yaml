    host: gig-dc1-g545
    database: master
    authentication:
      type: windows
      domain: OKCO
      user: Farhangain.Mohsen
    trustServerCertificate: true
    security:
      mode: readonly
      maxRowCount: 500

  p451:
    host: GIG-DC1-P451\NODE
    database: master
    authentication:
      type: windows
      domain: OKCO
      user: Farhangain.Mohsen
    trustServerCertificate: true
    security:
      mode: readonly
      maxRowCount: 500

security:
  mode: readonly
  maxRowCount: 500
  blockedKeywords:
    - xp_cmdshell
    - SHUTDOWN
    - DROP DATABASE
