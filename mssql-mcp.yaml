# SQL Server HA — Windows Auth as OKCO\Farhangain.Mohsen
#
# NTLM as OKCO\Farhangain.Mohsen:
#   Set MSSQL_PASSWORD in .cursor/mcp.json (or Cursor MCP UI). Never commit the real password.
# SSPI on domain-joined Windows (same login session):
#   Remove user/domain from authentication, install msnodesqlv8, keep type: windows.

defaultServer: g545

connections:
